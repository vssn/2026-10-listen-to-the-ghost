<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listen to the Ghost</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #07050f; overflow: hidden; }
      /* Phaser centres the canvas (and its HTML overlay) itself via margins */
      /* flow-root keeps the canvas margin from collapsing through #game */
      #game { width: 100%; height: 100%; position: relative; display: flow-root; }
      #game > div { top: 0; left: 0; } /* Phaser's HTML overlay: offset by the same margins as the canvas */
      canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
